name: Lint and Validation
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  test-lug:
    runs-on: ubuntu-latest
    name: Run checks
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.1/install
          extra_nix_config: |
            experimental-features = nix-command flakes recursive-nix ca-derivations dynamic-derivations
            extra-substituters = https://sjtug.cachix.org
            extra-trusted-public-keys = sjtug.cachix.org-1:0bD3nO47HROvtvVfkodDpE7AUwjFxQ/6l4fCbcC+7bc=
      - name: Setup Cachix (push to sjtug.cachix.org)
        uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: sjtug
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix flake check

  build-images:
    name: Build container images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-build-nix-images-${{ github.ref_name }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.1/install
          extra_nix_config: |
            experimental-features = nix-command flakes recursive-nix ca-derivations dynamic-derivations
            extra-substituters = https://sjtug.cachix.org
            extra-trusted-public-keys = sjtug.cachix.org-1:0bD3nO47HROvtvVfkodDpE7AUwjFxQ/6l4fCbcC+7bc=
      - name: Setup Cachix (push to sjtug.cachix.org)
        uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: sjtug
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build and load nix2container images
        run: |
          for img in caddy git-backend lug rsyncd rsync-gateway mirror-intel clash frontend-siyuan frontend-zhiyuan; do
            echo "::group::$img"
            nix run .#image-$img.copyToDockerDaemon --accept-flake-config --print-build-logs
            echo "::endgroup::"
          done
      - name: use CI config for docker-compose
        run: |
          cp docker-compose.ci.yml docker-compose.override.yml
          cp ./secrets/caddy.env.example ./secrets/caddy.env
          cp ./secrets/mirror-clone.env.example ./secrets/mirror-clone.env
          cp ./secrets/mirror-intel.env.example ./secrets/mirror-intel.env
          cp ./secrets/gcr-registry.ci.yml ./secrets/gcr-registry.yml
          cp ./secrets/docker-registry.ci.yml ./secrets/docker-registry.yml
          cp ./secrets/pg.env.example ./secrets/pg.env
          touch ./secrets/lug-secrets.sh
      - name: verify config (siyuan)
        run: docker compose -f docker-compose.yml -f docker-compose.siyuan.yml config --quiet
      - name: verify config (zhiyuan)
        run: docker compose -f docker-compose.yml -f docker-compose.zhiyuan.yml config --quiet
  test-vector:
    name: Vector edge configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: make vector-check
