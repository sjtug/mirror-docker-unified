name: Lint and Validation
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  test-lug:
    runs-on: ubuntu-latest
    name: Run checks
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.1/install
          extra_nix_config: |
            experimental-features = nix-command flakes recursive-nix ca-derivations dynamic-derivations
            extra-substituters = https://sjtug.cachix.org
            extra-trusted-public-keys = sjtug.cachix.org-1:0bD3nO47HROvtvVfkodDpE7AUwjFxQ/6l4fCbcC+7bc=
      - run: nix flake check
  test-vector:
    name: Vector edge configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: make vector-check
  test-docker-build:
    name: docker build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # Required to save to GitHub Actions Cache
    concurrency:
      # Lint and Validation-test-docker-build-{siyuan,zhiyuan}
      group: ${{ github.workflow }}-test-docker-build-${{ matrix.mirror }}
      cancel-in-progress: true
    strategy:
      matrix:
        mirror: ["siyuan", "zhiyuan"]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: "recursive"
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3
      - name: use CI config for docker-compose
        run: |
          cp docker-compose.ci.yml docker-compose.override.yml
          cp ./secrets/caddy.env.example ./secrets/caddy.env
          cp ./secrets/mirror-clone.env.example ./secrets/mirror-clone.env
          cp ./secrets/mirror-intel.env.example ./secrets/mirror-intel.env
          cp ./secrets/gcr-registry.ci.yml ./secrets/gcr-registry.yml
          cp ./secrets/docker-registry.ci.yml ./secrets/docker-registry.yml
          cp ./secrets/pg.env.example ./secrets/pg.env
          touch ./secrets/lug-secrets.sh
      - name: verify config
        run: docker compose -f docker-compose.yml -f docker-compose.${{ matrix.mirror }}.yml config
      - name: docker compose build
        uses: docker/bake-action@3acf805d94d93a86cce4ca44798a76464a75b88c # v6
        with:
          files: |
            docker-compose.yml
            docker-compose.${{ matrix.mirror }}.yml
            docker-compose.ci.yml
          set: |
            *.cache-from=type=gha,scope=${{ github.workflow }}-${{ github.ref_name }}-${{ matrix.mirror }}
            *.cache-to=type=gha,mode=max,scope=${{ github.workflow }}-${{ github.ref_name }}-${{ matrix.mirror }}
          load: true
