data_dir: /var/lib/vector
timezone: UTC

api:
  enabled: true
  address: 127.0.0.1:8686

enrichment_tables:
  repositories:
    type: file
    file:
      path: /etc/vector/repositories.csv
      encoding:
        type: csv

sources:
  caddy_files:
    type: file
    include:
      - /var/log/caddy/mirrorz/*.log
    read_from: beginning
    max_line_bytes: 262144
    glob_minimum_cooldown_ms: 1000

transforms:
  normalize_logs:
    type: remap
    inputs: [caddy_files]
    drop_on_abort: true
    reroute_dropped: true
    source: |
      # Caddy safely writes its native nested JSON format. Convert only the
      # fields accepted by mirrorz-log into the flat edge payload expected by
      # the central Vector pipeline.
      payload = parse_json!(string!(.message))
      if !is_object(payload) { abort }

      mirrorz = {
        "timestamp": to_float(payload.timestamp) ?? 0.0,
        "clientip": to_string(payload.request.remote_ip) ?? "",
        "serverip": to_string(payload.serverip) ?? "",
        "method": to_string(payload.request.method) ?? "",
        "scheme": to_string(payload.scheme) ?? "",
        "url": to_string(payload.request.uri) ?? "",
        "status": to_int(payload.status) ?? 0,
        "size": to_int(payload.size) ?? 0,
        "resp_time": to_float(payload.duration) ?? 0.0,
        "http_host": to_string(payload.http_host) ?? "",
        "referer": to_string(payload.request.headers.Referer[0]) ?? "",
        "user_agent": to_string(payload.request.headers."User-Agent"[0]) ?? "",
        "request_id": to_string(payload.request_id) ?? "",
        "proto": to_string(payload.request.proto) ?? "",
        "sent_http_content_type": to_string(payload.resp_headers."Content-Type"[0]) ?? ""
      }

      # Caddy exposes selected-upstream and timing placeholders only for
      # reverse-proxy responses. Omit these keys entirely for static files so
      # the dominant traffic path stays compact; the central normalizer
      # supplies its usual empty/zero defaults.
      upstream_addr = to_string(payload.upstream_addr) ?? ""
      if upstream_addr != "" {
        mirrorz.upstream_addr = upstream_addr
        mirrorz.upstream_header_time =
          (to_float(payload.upstream_header_time_ms) ?? 0.0) / 1000.0
        mirrorz.upstream_response_time =
          (to_float(payload.upstream_response_time_ms) ?? 0.0) / 1000.0
      }

      .message = encode_json(mirrorz)
      .org = get_env_var!("VECTOR_ORG")
      .server = get_env_var!("VECTOR_SERVER")

  repo_access_fields:
    type: remap
    inputs: [normalize_logs]
    drop_on_abort: true
    source: |
      payload = parse_json!(string!(.message))
      url = to_string(payload.url) ?? ""
      if url == "/" || starts_with(url, "/monitor/") || starts_with(url, "/lug/") {
        abort
      }

      git_repo, git_error = parse_regex(url, r'^/*git/+(?P<repo>[^/?]+)')
      normal_repo, normal_error = parse_regex(url, r'^/*(?P<repo>[^/?]+)')
      .repo = if git_error == null {
        "/git/" + to_string(git_repo.repo)
      } else if normal_error == null {
        to_string(normal_repo.repo)
      } else {
        "/"
      }
      known_repositories = find_enrichment_table_records!("repositories", {"repo": .repo})
      if length(known_repositories) == 0 {
        .repo = "_other"
      }

      request_method = upcase(to_string(payload.method) ?? "")
      .method = if includes(["GET", "HEAD"], request_method) {
        request_method
      } else {
        "OTHER"
      }
      status = to_int(payload.status) ?? 0
      .status_class = if status < 100 || status >= 600 {
        "other"
      } else if status < 200 {
        "1xx"
      } else if status < 300 {
        "2xx"
      } else if status < 400 {
        "3xx"
      } else if status < 500 {
        "4xx"
      } else {
        "5xx"
      }
      .status = status
      .request_count = 1
      .response_bytes = to_int(payload.size) ?? 0
      .response_time_seconds = to_float(payload.resp_time) ?? 0.0

  repo_request_metrics:
    type: log_to_metric
    inputs: [repo_access_fields]
    metrics:
      - type: counter
        field: request_count
        name: mirror_repo_requests_total
        increment_by_value: true
        tags:
          method: "{{ method }}"
          repo: "{{ repo }}"
          status_class: "{{ status_class }}"

  repo_response_time_metrics:
    type: log_to_metric
    inputs: [repo_access_fields]
    metrics:
      - type: histogram
        field: response_time_seconds
        name: mirror_repo_response_time_seconds
        tags:
          repo: "{{ repo }}"

  repo_download_fields:
    type: remap
    inputs: [repo_access_fields]
    drop_on_abort: true
    source: |
      method = string!(.method)
      status = int!(.status)
      if method != "GET" || status < 200 || status >= 300 {
        abort
      }
      .download_bytes = int!(.response_bytes)

  repo_download_metrics:
    type: log_to_metric
    inputs: [repo_download_fields]
    metrics:
      - type: counter
        field: download_bytes
        name: mirror_repo_download_bytes_total
        increment_by_value: true
        tags:
          repo: "{{ repo }}"

sinks:
  parse_errors:
    type: file
    inputs: [normalize_logs.dropped]
    path: /var/lib/vector/parse-errors-%Y-%m-%d.log
    encoding:
      codec: json

  repo_metrics:
    type: prometheus_exporter
    inputs:
      - repo_download_metrics
      - repo_request_metrics
      - repo_response_time_metrics
    address: 0.0.0.0:9598
