# Optional central mirrorz-log forwarding. vector/run.sh loads this component
# only when all three per-host mTLS files are present and readable.
sinks:
  central_vector:
    type: vector
    inputs: [normalize_logs]
    address: https://repo.nju.edu.cn:49544
    compression: true
    # Central availability must not take down the local metrics exporter; the
    # disk buffer retains events while delivery is unavailable.
    healthcheck:
      enabled: false
    acknowledgements:
      enabled: true
    batch:
      max_events: 5000
      max_bytes: 8388608
      timeout_secs: 1
    buffer:
      type: disk
      max_size: 4294967296
      when_full: block
    request:
      timeout_secs: 60
      concurrency: adaptive
    tls:
      enabled: true
      ca_file: /etc/mirrorz/vector/tls/ca.crt
      crt_file: /etc/mirrorz/vector/tls/client.crt
      key_file: /etc/mirrorz/vector/tls/client.key
      server_name: repo.nju.edu.cn
      verify_certificate: true
      verify_hostname: true
