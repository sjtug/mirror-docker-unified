# 按照提供的 ngx_json 可直接用以下配置
data_dir: /var/lib/vector
timezone: UTC

# 按需开启
api:
  enabled: true
  address: 127.0.0.1:8686

sources:
  caddy_files:
    type: file
    include:
      - /var/log/caddy/mirrorz/*.log
    read_from: beginning
    max_line_bytes: 262144
    glob_minimum_cooldown_ms: 1000

transforms:
  node_fields:
    type: remap
    inputs: [caddy_files]
    source: |
      # Supplied per mirror host by its Docker Compose override.
      .org = get_env_var!("VECTOR_ORG")
      .server = get_env_var!("VECTOR_SERVER")

sinks:
  central_vector:
    type: vector
    inputs: [node_fields]
    address: https://repo.nju.edu.cn:49544
    compression: true
    acknowledgements:
      enabled: true
    batch:
      max_events: 5000
      max_bytes: 8388608
      timeout_secs: 1
    buffer:
      type: disk
      max_size: 4294967296
      when_full: block
    request:
      timeout_secs: 60
      concurrency: adaptive
    tls:
      enabled: true
      ca_file: /etc/mirrorz/vector/tls/ca.crt
      crt_file: /etc/mirrorz/vector/tls/client.crt
      key_file: /etc/mirrorz/vector/tls/client.key
      server_name: repo.nju.edu.cn
      verify_certificate: true
      verify_hostname: true
